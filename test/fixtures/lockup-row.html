<!doctype html>
<!-- Hand-written lockup playlist row (fake data) for Classic selector tests. -->
<html lang="en">
<body>
  <ytd-playlist-video-list-renderer>
    <yt-lockup-view-model class="ytLockupViewModelHost">
      <a class="yt-lockup-view-model__content-image" href="/watch?v=lockuprow01&amp;list=WL">
        <yt-thumbnail-overlay-badge-view-model>
          <div class="yt-badge-shape__text">0:45</div>
        </yt-thumbnail-overlay-badge-view-model>
        <div class="ytThumbnailOverlayProgressBarHostWatchedProgressBarSegment" style="width: 40%"></div>
      </a>
      <yt-lockup-metadata-view-model>
        <a class="yt-lockup-metadata-view-model-wiz__title" href="/watch?v=lockuprow01&amp;list=WL">Lockup row title</a>
        <div class="yt-content-metadata-view-model-wiz">
          <a href="/@lockupchan">Lockup Channel</a>
          <span>2 years ago</span>
        </div>
        <button aria-label="Action menu"></button>
      </yt-lockup-metadata-view-model>
    </yt-lockup-view-model>
  </ytd-playlist-video-list-renderer>
  <ytd-playlist-video-renderer>
    <a id="thumbnail" href="/watch?v=classicrow1&amp;list=WL"></a>
    <h3><a id="video-title" href="/watch?v=classicrow1&amp;list=WL">Classic outer</a></h3>
    <ytd-channel-name id="channel-name"><a href="/@classic">Classic Channel</a></ytd-channel-name>
    <yt-formatted-string id="video-info"><span>1 year ago</span></yt-formatted-string>
    <yt-lockup-view-model>
      <a class="yt-lockup-metadata-view-model-wiz__title" href="/watch?v=nestedlock1&amp;list=WL">Nested lockup</a>
    </yt-lockup-view-model>
  </ytd-playlist-video-renderer>
</body>
</html>
