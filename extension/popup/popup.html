<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Watch Later Cleaner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><img src="../icons/icon48.png" alt="" width="24" height="24" /> Watch Later Cleaner</header>
    <p id="page-status" class="muted">Checking current tab…</p>
    <div class="buttons">
      <button id="open-wl">Open Watch Later</button>
      <button id="show-panel" disabled>Show cleaner panel</button>
      <button id="preview" disabled>Preview (dry run)</button>
      <button id="analytics" disabled>Analytics</button>
    </div>
    <form id="settings">
      <h2>Criteria (matches any)</h2>
      <label><input type="checkbox" name="watched" /> Watched ≥ <input type="number" name="watchedThreshold" min="1" max="100" /> %</label>
      <label
        ><input type="checkbox" name="olderThan" /> Published ≥ <input type="number" name="olderThanValue" min="1" step="1" />
        <select name="olderThanUnit">
          <option value="days">days</option>
          <option value="weeks">weeks</option>
          <option value="months">months</option>
          <option value="years">years</option>
        </select>
        ago</label
      >
      <label><input type="checkbox" name="unavailable" /> Unavailable / deleted / private</label>
      <label><input type="checkbox" name="channelFilter" /> Channel contains</label>
      <input type="text" name="channelKeywords" placeholder="comma-separated" />
      <label><input type="checkbox" name="titleFilter" /> Title contains</label>
      <input type="text" name="titleKeywords" placeholder="comma-separated" />
      <label class="danger"><input type="checkbox" name="removeAll" /> Remove ALL videos</label>
      <h2>Options</h2>
      <label title="Fast uses YouTube's own web requests and keeps working in a background tab; Classic clicks each row's menu."
        >Mode
        <select name="removalMode">
          <option value="fast">Fast (works in background)</option>
          <option value="classic">Classic (page clicks)</option>
        </select></label
      >
      <label><input type="checkbox" name="loadAllFirst" /> Load all first (Classic: auto-scroll)</label>
      <label><input type="checkbox" name="showKept" /> Preview: also list kept videos (with parsed age)</label>
      <label>Delay between removals <input type="number" name="delayMs" min="100" step="50" /> ms</label>
      <label title="Used only if the menu entry can't be found by text or icon (unusual UI language). 0 disables."
        >Menu fallback position <input type="number" name="menuFallbackPosition" min="0" max="20"
      /></label>
      <p id="saved" class="muted">Settings are saved automatically.</p>
    </form>
    <p class="muted small">Removal always requires Preview + confirm on the page. Nothing is sent anywhere except youtube.com.</p>
    <script src="../lib/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
